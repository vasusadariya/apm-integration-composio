services:
  - type: web
    name: oauth-guides-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_API_KEY
        sync: false          # set in the Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # your Vercel URL, e.g. https://oauth-guides.vercel.app
